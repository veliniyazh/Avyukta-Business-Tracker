  <button class="tab-btn" data-tab="suppliers">Suppliers</button>
  <button class="tab-btn" data-tab="reports">Reports</button>

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:0}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function localDateStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getPeriodRange(preset){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  if(preset==='day'){ const t = localDateStr(now); return [t,t]; }
  if(preset==='month'){ return [localDateStr(new Date(y,m,1)), localDateStr(new Date(y,m+1,0))]; }
  if(preset==='quarter'){ const q = Math.floor(m/3); return [localDateStr(new Date(y,q*3,1)), localDateStr(new Date(y,q*3+3,0))]; }
  if(preset==='year'){ return [localDateStr(new Date(y,0,1)), localDateStr(new Date(y,11,31))]; }
  return [reportCustomStart || localDateStr(now), reportCustomEnd || localDateStr(now)];
}

function nextOrderNumber(){
  let max = 0;
  orders.forEach(o=>{
    const m = String(o.orderNumber||'').match(/(\d+)$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'ORD-' + String(max+1).padStart(4,'0');
}

function orderTotals(o){
  let selling=0, cost=0;
  (o.items||[]).forEach(it=>{
    const qty = Number(it.qty||1);
    selling += Number(it.selling||0) * qty;
    cost += Number(it.cost||0) * qty;
  });
  // COD orders are not counted as realised profit until payment is received.
  // The full selling value is still retained for the order/revenue view.
  const isCOD = o.paymentType === 'Cash on Delivery';
  return { selling, cost, profit: isCOD ? 0 : selling-cost };
}

async function loadData(){
  try{
    const orderDoc = await db.collection('avyukta-'+STORE_ID).doc('orders').get();
    orders = orderDoc.exists ? (orderDoc.data().list || []) : [];
  }catch(e){ orders = []; console.error('load orders failed', e); }
  try{
    const txDoc = await db.collection('avyukta-'+STORE_ID).doc('transactions').get();
    transactions = txDoc.exists ? (txDoc.data().list || []) : [];
  }catch(e){ transactions = []; console.error('load transactions failed', e); }
  try{
    const supDoc = await db.collection('avyukta-'+STORE_ID).doc('suppliers').get();
    suppliers = supDoc.exists ? (supDoc.data().list || []) : [];
  }catch(e){ suppliers = []; console.error('load suppliers failed', e); }
  loaded = true;
  render();
  attachLiveSync();
}

function attachLiveSync(){
  db.collection('avyukta-'+STORE_ID).doc('orders').onSnapshot(doc=>{
    if(doc.exists){ orders = doc.data().list || []; render(); }
  });
  db.collection('avyukta-'+STORE_ID).doc('transactions').onSnapshot(doc=>{
    if(doc.exists){ transactions = doc.data().list || []; render(); }
  });
  db.collection('avyukta-'+STORE_ID).doc('suppliers').onSnapshot(doc=>{
    if(doc.exists){ suppliers = doc.data().list || []; render(); }
  });
}

async function saveOrders(){
  try{ await db.collection('avyukta-'+STORE_ID).doc('orders').set({list: orders}); }
  catch(e){ console.error('save orders failed', e); }
}
async function saveTransactions(){
  try{ await db.collection('avyukta-'+STORE_ID).doc('transactions').set({list: transactions}); }
  catch(e){ console.error('save transactions failed', e); }
}
async function saveSuppliers(){
  try{ await db.collection('avyukta-'+STORE_ID).doc('suppliers').set({list: suppliers}); }
  catch(e){ console.error('save suppliers failed', e); }
}

function supplierBalances(){
  const map = {};
  suppliers.forEach(s=>{ map[s.name] = Number(s.opening||0); });
  transactions.forEach(t=>{
    if(!(t.supplier in map)) map[t.supplier] = 0;
    map[t.supplier] += t.type==='Purchase' ? Number(t.amount||0) : -Number(t.amount||0);
  });
  return map;
}

function switchTab(tab){
  activeTab = tab;
  selectedOrderId = null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

function render(){
  const main = document.getElementById('main');
  if(!loaded){ main.innerHTML = '<div class="empty">Loading your ledger…</div>'; return; }
  if(activeTab==='dashboard') main.innerHTML = renderDashboard();
  else if(activeTab==='orders') main.innerHTML = renderOrders();
  else if(activeTab==='purchases') main.innerHTML = renderPurchases();
  else if(activeTab==='suppliers') main.innerHTML = renderSuppliers();
  else main.innerHTML = renderReports();
  attachHandlers();
}


function showToast(message){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=message; el.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function salesChartHtml(){
  const now=new Date(),days=[];
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const key=localDateStr(d);days.push({key,total:orders.filter(o=>o.date===key).reduce((s,o)=>s+orderTotals(o).selling,0),label:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})});}
  const max=Math.max(...days.map(d=>d.total),1),W=700,H=190,L=14,R=14,T=20,B=28;
  const x=i=>L+i*((W-L-R)/(days.length-1)), y=v=>T+(H-T-B)-(v/max)*(H-T-B);
  const pts=days.map((d,i)=>`${x(i)},${y(d.total)}`).join(' '), area=`${L},${H-B} ${pts} ${W-R},${H-B}`;
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="salesArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6b185b" stop-opacity=".20"/><stop offset="1" stop-color="#6b185b" stop-opacity="0"/></linearGradient></defs><line class="chart-grid" x1="${L}" x2="${W-R}" y1="${y(max)}" y2="${y(max)}"/><line class="chart-grid" x1="${L}" x2="${W-R}" y1="${y(max/2)}" y2="${y(max/2)}"/><line class="chart-grid" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/><polygon class="chart-area" points="${area}"/><polyline class="chart-line" points="${pts}"/>${days.map((d,i)=>`<circle class="chart-dot" cx="${x(i)}" cy="${y(d.total)}" r="4"/><text class="chart-label" x="${x(i)}" y="${H-8}" text-anchor="middle">${escapeHtml(d.label)}</text>`).join('')}</svg></div>`;
}
function topProductsHtml(){
  const map={};orders.forEach(o=>(o.items||[]).forEach(it=>{const k=String(it.details||'').trim();if(!k)return;const q=Number(it.qty||1);if(!map[k])map[k]={qty:0,sales:0};map[k].qty+=q;map[k].sales+=Number(it.selling||0)*q;}));
  const rows=Object.entries(map).sort((a,b)=>b[1].qty-a[1].qty).slice(0,5);
  if(!rows.length)return '<div class="empty">Your best-selling sarees will appear here.</div>';
  return `<div class="mini-list">${rows.map(([n,v])=>`<div class="mini-row"><div class="mini-main"><div class="mini-title">${escapeHtml(n)}</div><div class="mini-sub">${v.qty} sold</div></div><div class="mini-value">${fmt(v.sales)}</div></div>`).join('')}</div>`;
}
function recentOrdersHtml(){
  const list=[...orders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

function renderDashboard(){

  return `<section class="hero"><div class="hero-kicker">Avyukta Fashions • Business overview</div><div class="hero-title">Good business starts with a clear ledger.</div><div class="hero-sub">Track orders, saree sales, supplier payments and profit in one simple place.</div><div class="quick-actions"><button class="quick-btn primary" data-quick="orders">＋ New order</button><button class="quick-btn" data-quick="purchases">＋ Purchase / repayment</button><button class="quick-btn" data-quick="suppliers">＋ Add supplier</button></div></section>
  <div class="section-head"><div><h2>${dashMode==='day'?'Daily summary':'All-time summary'}</h2><p>${dashMode==='day'?'See how today is performing':'All records across your business'}</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn ghost small" id="modeToggle">${dashMode==='day'?'View all-time':'View by day'}</button>${dashMode==='day'?`<input type="date" id="dashDateInput" value="${dashDate}">`:''}</div></div>
  <div class="cards"><div class="card"><div class="label">Orders</div><div class="value">${dayOrders.length}</div><div class="hint">Orders received</div></div><div class="card"><div class="label">Revenue</div><div class="value small">${fmt(revenue)}</div><div class="hint">Total sales</div></div><div class="card thread"><div class="label">Profit</div><div class="value small">${fmt(profit)}</div><div class="hint">Sales less cost</div></div><div class="card madder"><div class="label">Purchases</div><div class="value small">${fmt(purchaseSum)}</div><div class="hint">Supplier purchases</div></div><div class="card thread"><div class="label">Repayments</div><div class="value small">${fmt(repaySum)}</div><div class="hint">Paid to suppliers</div></div><div class="card madder"><div class="label">Outstanding</div><div class="value small">${fmt(outstanding)}</div><div class="hint">Due to suppliers</div></div></div>
  <div class="dashboard-grid"><div class="panel"><div class="panel-title"><div><h3>Sales trend</h3><span>Last 7 days</span></div></div>${salesChartHtml()}</div><div class="panel"><div class="panel-title"><div><h3>Top selling sarees</h3><span>By quantity</span></div></div>${topProductsHtml()}</div><div class="panel"><div class="panel-title"><div><h3>Recent orders</h3><span>Latest activity</span></div></div>${recentOrdersHtml()}</div><div class="panel"><div class="panel-title"><div><h3>Supplier balances</h3><span>Current position</span></div></div>${supplierRows}</div></div>`;
}

function orderCardHtml(o){
  const t = orderTotals(o);
  const paymentTag = o.paymentType==='Prepaid'
    ? `<span class="tag prepaid">Prepaid</span>`
    : `<span class="tag cod">COD</span>`;
  const itemCount = (o.items||[]).length;
  return `<div class="order-card" data-open-order="${o.id}">
    <div class="order-card-top">
      <div>
        <div class="order-card-num">${escapeHtml(o.orderNumber)}</div>
        <div class="order-card-date">${o.date}</div>
      </div>
      <div class="order-card-actions">
        ${paymentTag}
        <button class="del" data-del-order="${o.id}">✕</button>
      </div>
    </div>
    <div class="order-card-customer">${escapeHtml(o.whatsapp)}</div>
    <div class="order-card-summary">
      <span>${itemCount} saree${itemCount===1?'':'s'}</span>
      <span>${fmt(t.selling)}</span>
      ${o.paymentType==='Cash on Delivery' ? `<span>Advance ${fmt(o.advanceAmount||0)}</span>` : ''}
      <span class="thread-text">${o.paymentType==='Cash on Delivery' ? 'Profit not counted' : `${fmt(t.profit)} profit`}</span>
      ${o.trackingNumber ? `<span class="tracking-badge">📦 ${escapeHtml(o.trackingCourier||'Tracking')}</span>` : ''}
    </div>
  </div>`;
}

function orderCardsHtml(list, emptyMsg){
  const sorted = [...list].sort((a,b)=> b.date.localeCompare(a.date));
  return sorted.map(orderCardHtml).join('') || `<div class="empty">${emptyMsg||'No orders here.'}</div>`;
}

function txCardsHtml(list, emptyMsg){

function renderTrackingQr(){const box=document.getElementById('trackingQr');const o=selectedOrderId?orders.find(x=>x.id===selectedOrderId):null;if(!box||!o||!o.trackingNumber||typeof QRCode==='undefined')return;box.innerHTML='';new QRCode(box,{text:trackingQrValue(o),width:102,height:102,colorDark:'#20253a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}

function renderOrderModal(){
  if(!selectedOrderId) return '';
  const o = orders.find(x=>x.id===selectedOrderId);
  if(!o) return '';
  if(editingOrderId===o.id) return renderOrderEditModal(o);
  const t = orderTotals(o);
  const paymentTag = o.paymentType==='Prepaid'
    ? `<span class="tag prepaid">Prepaid</span>`
    : `<span class="tag cod">COD</span>`;
  const itemsHtml = (o.items||[]).map(it=>{
    const vendorTag = it.vendor==='Own Production'
      ? `<span class="tag vendor-own">${escapeHtml(it.vendor)}</span>`
      : `<span class="tag vendor-other">${escapeHtml(it.vendor||'—')}</span>`;
    const qty = Number(it.qty||1);
    const lineSelling = Number(it.selling||0)*qty;
    const lineCost = Number(it.cost||0)*qty;
    const lineProfit = lineSelling-lineCost;
    return `<div class="modal-item">

function renderReports(){
  const [start, end] = getPeriodRange(reportPreset);
  const periodOrders = orders.filter(o=> o.date >= start && o.date <= end);
  const periodTx = transactions.filter(t=> t.date >= start && t.date <= end);

  const revenue = periodOrders.reduce((s,o)=>s+orderTotals(o).selling,0);
  const cost = periodOrders.reduce((s,o)=>s+orderTotals(o).cost,0);
  const profit = revenue - cost;
  const purchaseSum = periodTx.filter(t=>t.type==='Purchase').reduce((s,t)=>s+Number(t.amount||0),0);
  const repaySum = periodTx.filter(t=>t.type==='Repayment').reduce((s,t)=>s+Number(t.amount||0),0);

  const presets = [
    ['day','Today'],['month','This month'],['quarter','This quarter'],['year','This year'],['custom','Custom']
  ];
  const presetBtns = presets.map(([key,label])=>
    `<button type="button" class="btn ${reportPreset===key?'':'ghost'} small" data-report-preset="${key}">${label}</button>`
  ).join('');

  const rangeLabel = start===end ? start : `${start} → ${end}`;

  return `
    <div class="hero" style="margin-bottom:16px"><div class="hero-kicker">Business intelligence</div><div class="hero-title" style="font-size:25px">Reports that are easy to understand.</div><div class="hero-sub">Review sales, profit, purchases and repayments for any period.</div></div><div class="row"><h2>Reports</h2><button class="btn ghost small" id="printReportBtn">Print / Save PDF</button></div>
    <div class="row" style="gap:6px;">${presetBtns}</div>
    ${reportPreset==='custom' ? `
      <div class="row" style="gap:10px;">
        <div><label>From</label><input type="date" id="reportStartInput" value="${start}"></div>
        <div><label>To</label><input type="date" id="reportEndInput" value="${end}"></div>
      </div>
    ` : ''}
    <div class="empty" style="text-align:left; padding:0 0 10px;">Showing ${rangeLabel}</div>
    <div class="cards">
      <div class="card"><div class="label">Orders</div><div class="value">${periodOrders.length}</div></div>
      <div class="card"><div class="label">Revenue</div><div class="value small">${fmt(revenue)}</div></div>
      <div class="card thread"><div class="label">Profit</div><div class="value small">${fmt(profit)}</div></div>
      <div class="card madder"><div class="label">Purchases</div><div class="value small">${fmt(purchaseSum)}</div></div>
      <div class="card thread"><div class="label">Repayments</div><div class="value small">${fmt(repaySum)}</div></div>

    <div class="row"><h2>Orders in this period (${periodOrders.length})</h2></div>
    <div class="list-cards">
      ${orderCardsHtml(periodOrders, 'No orders in this period.')}
    </div>
    <div class="row" style="margin-top:22px;"><h2>Purchases &amp; repayments in this period (${periodTx.length})</h2></div>
    <div class="list-cards">
      ${txCardsHtml(periodTx, 'No purchases or repayments in this period.')}
    </div>
    ${renderOrderModal()}
  `;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str||'';
  return d.innerHTML;
}

function resizeImage(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function attachItemBlockHandlers(block){
  const idx = block.dataset.idx;
  const vendorSelect = block.querySelector('.item-vendor-select');
  const vendorOtherWrap = block.querySelector('.item-vendor-other-wrap');
  if(vendorSelect) vendorSelect.onchange = ()=>{
    vendorOtherWrap.style.display = vendorSelect.value==='__other__' ? 'block' : 'none';
  };
  const imageInput = block.querySelector('.item-image-input');
  const imgPreview = block.querySelector('.item-img-preview');
  const imgThumb = block.querySelector('.item-img-thumb');
  const imgClear = block.querySelector('.item-img-clear');
  if(imageInput) imageInput.onchange = ()=>{
    const file = imageInput.files[0];
    if(!file) return;
    resizeImage(file, 400, (dataUrl)=>{
      itemImages[idx] = dataUrl;
      imgThumb.src = dataUrl;
      imgPreview.style.display = 'flex';
    });
  };
  if(imgClear) imgClear.onclick = ()=>{
    delete itemImages[idx];
    imageInput.value = '';
    imgPreview.style.display = 'none';
  };
  const removeBtn = block.querySelector('.item-remove-btn');
  if(removeBtn) removeBtn.onclick = ()=>{
    const container = document.getElementById('itemsContainer');
    if(container.children.length <= 1) return; // keep at least one saree
    delete itemImages[idx];
    block.remove();
    renumberItemBlocks();
  };
}

function renumberItemBlocks(){
  const container = document.getElementById('itemsContainer');
  if(!container) return;
  container.querySelectorAll('.item-block').forEach((block, pos)=>{
    const label = block.querySelector('.item-label');
    if(label) label.textContent = 'Saree ' + (pos+1);
  });
}

function renumberEditItemBlocks(){
  const container=document.getElementById('editItemsContainer');
  if(!container) return;
  container.querySelectorAll('.item-block').forEach((block,pos)=>{
    const label=block.querySelector('.item-label');
    if(label) label.textContent='Saree '+(pos+1);
  });
}

function attachHandlers(){
  document.querySelectorAll('.tab-btn,.mobile-tab').forEach(b=>{b.onclick=()=>switchTab(b.dataset.tab);b.classList.toggle('active',b.dataset.tab===activeTab);});
  document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{switchTab(b.dataset.quick);const s=document.getElementById('quickSheet');if(s)s.classList.remove('open');});
  const fab=document.getElementById('fabBtn'),sheet=document.getElementById('quickSheet'),close=document.getElementById('sheetClose');
  if(fab)fab.onclick=()=>sheet&&sheet.classList.add('open');if(close)close.onclick=()=>sheet&&sheet.classList.remove('open');if(sheet)sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open');};
  const hd=document.getElementById('headerDate');if(hd)hd.textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  document.querySelectorAll('.tab-btn').forEach(b=> b.onclick = ()=> switchTab(b.dataset.tab));

  const modeToggle = document.getElementById('modeToggle');
  if(modeToggle) modeToggle.onclick = ()=>{ dashMode = dashMode==='day' ? 'all' : 'day'; render(); };

  const dashDateInput = document.getElementById('dashDateInput');
  if(dashDateInput) dashDateInput.onchange = (e)=>{ dashDate = e.target.value; render(); };

  document.querySelectorAll('[data-report-preset]').forEach(btn=>{
    btn.onclick = ()=>{ reportPreset = btn.dataset.reportPreset; render(); };
  });
  const reportStartInput = document.getElementById('reportStartInput');
  if(reportStartInput) reportStartInput.onchange = (e)=>{ reportCustomStart = e.target.value; render(); };
  const printReportBtn=document.getElementById('printReportBtn');if(printReportBtn)printReportBtn.onclick=()=>window.print();
  const reportEndInput = document.getElementById('reportEndInput');
  if(reportEndInput) reportEndInput.onchange = (e)=>{ reportCustomEnd = e.target.value; render(); };

  // order items
  const itemsContainer = document.getElementById('itemsContainer');
  if(itemsContainer){
    itemsContainer.querySelectorAll('.item-block').forEach(attachItemBlockHandlers);
  }
  const addItemBtn = document.getElementById('addItemBtn');
  if(addItemBtn) addItemBtn.onclick = ()=>{
    itemCounter += 1;
    const idx = itemCounter;
    itemsContainer.insertAdjacentHTML('beforeend', itemBlockHtml(idx));
    const block = itemsContainer.querySelector(`.item-block[data-idx="${idx}"]`);
    attachItemBlockHandlers(block);
    renumberItemBlocks();
  };

  function toggleAdvanceField(selectId, wrapId){
    const select=document.getElementById(selectId);
    const wrap=document.getElementById(wrapId);
    if(!select || !wrap) return;
    const show=select.value==='Cash on Delivery';
    wrap.style.display=show?'block':'none';
    if(!show){ const input=wrap.querySelector('input'); if(input) input.value='0'; }
  }
  const orderPaymentType=document.getElementById('orderPaymentType');
  if(orderPaymentType){ orderPaymentType.onchange=()=>toggleAdvanceField('orderPaymentType','advanceAmountWrap'); toggleAdvanceField('orderPaymentType','advanceAmountWrap'); }
  function setupTrackingForm(form){if(!form)return;const sel=form.querySelector('.tracking-courier-select'),wrap=form.querySelector('.tracking-courier-other-wrap');if(sel)sel.onchange=()=>{if(wrap)wrap.style.display=sel.value==='__other__'?'block':'none';};}
  setupTrackingForm(document.getElementById('orderForm')); setupTrackingForm(document.getElementById('editOrderForm')); renderTrackingQr();

  const orderForm = document.getElementById('orderForm');
  if(orderForm) orderForm.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(orderForm);
    const items = [];
    itemsContainer.querySelectorAll('.item-block').forEach(block=>{
      const idx = block.dataset.idx;
      const vendorSel = block.querySelector('.item-vendor-select').value;
      const vendorOther = block.querySelector('.item-vendor-other');
      const vendor = vendorSel==='__other__' ? ((vendorOther && vendorOther.value) || 'Other vendor') : vendorSel;
      items.push({
        id: uid(),
        details: block.querySelector('.item-details').value,
        image: itemImages[idx] || null,
        selling: block.querySelector('.item-selling').value,
        cost: block.querySelector('.item-cost').value,
        qty: block.querySelector('.item-qty').value,
        vendor: vendor
      });
    });
    const tracking=getTrackingData(orderForm);
    orders.push({
      id: uid(),
      date: f.get('date'),
      orderNumber: f.get('orderNumber'),
      whatsapp: f.get('whatsapp'),
      address: f.get('address'),
      paymentType: f.get('paymentType'),
      advanceAmount: f.get('paymentType')==='Cash on Delivery' ? Number(f.get('advanceAmount')||0) : 0,
      ...tracking,
      items: items
    });
    await saveOrders();
    showToast('Order saved successfully');
    render();
  };

  // order cards -> open modal
  document.querySelectorAll('[data-open-order]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-del-order]')) return;
      selectedOrderId = card.dataset.openOrder;
      render();
    });
  });
  const modalOverlay = document.getElementById('orderModalOverlay');
  if(modalOverlay) modalOverlay.addEventListener('click', (e)=>{
    if(e.target.id==='orderModalOverlay'){ selectedOrderId = null; render(); }
  });
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  if(modalCloseBtn) modalCloseBtn.onclick = ()=>{ editingOrderId = null; selectedOrderId = null; render(); };

  // Edit an existing order. All saved order fields remain editable.
  document.querySelectorAll('[data-edit-order]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      editingOrderId = btn.dataset.editOrder;
      selectedOrderId = btn.dataset.editOrder;
      render();
    };
  });

  const editPaymentType=document.getElementById('editOrderPaymentType');
  if(editPaymentType){ editPaymentType.onchange=()=>toggleAdvanceField('editOrderPaymentType','editAdvanceAmountWrap'); toggleAdvanceField('editOrderPaymentType','editAdvanceAmountWrap'); }

  const editForm = document.getElementById('editOrderForm');
  if(editForm && selectedOrderId){
    const editOrder = orders.find(o=>o.id===selectedOrderId);
    const editItemsContainer = document.getElementById('editItemsContainer');
    if(editOrder && editItemsContainer){
      itemCounter = Math.max(1, (editOrder.items||[]).length) - 1;
      itemImages = {};
      editItemsContainer.querySelectorAll('.item-block').forEach((block, pos)=>{
        const it = (editOrder.items||[])[pos] || {};
        const idx = block.dataset.idx;
        block.dataset.existingId = it.id || '';
        const details = block.querySelector('.item-details');
        const selling = block.querySelector('.item-selling');
        const cost = block.querySelector('.item-cost');
        const qty = block.querySelector('.item-qty');
        const vendor = block.querySelector('.item-vendor-select');
        const vendorOther = block.querySelector('.item-vendor-other');
        if(details) details.value = it.details || '';
        if(selling) selling.value = it.selling ?? '';
        if(cost) cost.value = it.cost ?? '';
        if(qty) qty.value = it.qty ?? 1;
        if(vendor){
          const known = Array.from(vendor.options).some(op=>op.value===(it.vendor||'Own Production'));
          vendor.value = known ? (it.vendor||'Own Production') : '__other__';
          if(vendorOther) vendorOther.value = known ? '' : (it.vendor||'');
        }
        if(it.image){
          itemImages[idx] = it.image;
          const preview=block.querySelector('.item-img-preview');
          const thumb=block.querySelector('.item-img-thumb');
          if(thumb) thumb.src=it.image;
          if(preview) preview.style.display='flex';
        }
        attachItemBlockHandlers(block);
        if(vendor) vendor.onchange();
      });

      const editAddItemBtn = document.getElementById('editAddItemBtn');
      if(editAddItemBtn) editAddItemBtn.onclick = ()=>{
        itemCounter += 1;
        const idx = itemCounter;
        editItemsContainer.insertAdjacentHTML('beforeend', itemBlockHtml(idx));
        const block = editItemsContainer.querySelector(`.item-block[data-idx="${idx}"]`);
        attachItemBlockHandlers(block);
        renumberEditItemBlocks();
      };

      const cancelEditBtn = document.getElementById('cancelEditBtn');
      if(cancelEditBtn) cancelEditBtn.onclick = ()=>{ editingOrderId=null; render(); };

      editForm.onsubmit = async (e)=>{
        e.preventDefault();
        const f = new FormData(editForm);
        const updatedItems=[];
        editItemsContainer.querySelectorAll('.item-block').forEach(block=>{
          const idx=block.dataset.idx;
          const vendorSel=block.querySelector('.item-vendor-select');
          const vendorOther=block.querySelector('.item-vendor-other');
          const vendor=vendorSel.value==='__other__' ? ((vendorOther&&vendorOther.value)||'Other vendor') : vendorSel.value;
          updatedItems.push({
            id: block.dataset.existingId || uid(),
            details: block.querySelector('.item-details').value,
            image: Object.prototype.hasOwnProperty.call(itemImages,idx) ? itemImages[idx] : null,
            selling: block.querySelector('.item-selling').value,
            cost: block.querySelector('.item-cost').value,
            qty: block.querySelector('.item-qty').value,
            vendor
          });
        });
        const orderIndex=orders.findIndex(o=>o.id===selectedOrderId);
        if(orderIndex<0) return;
        const tracking=getTrackingData(editForm);
        orders[orderIndex]={
          ...orders[orderIndex],
          date:f.get('date'),
          orderNumber:f.get('orderNumber'),
          whatsapp:f.get('whatsapp'),
          address:f.get('address'),
          paymentType:f.get('paymentType'),
          advanceAmount:f.get('paymentType')==='Cash on Delivery' ? Number(f.get('advanceAmount')||0) : 0,
          ...tracking,
          items:updatedItems
        };
        await saveOrders();
        editingOrderId=null;
        showToast('Order updated successfully');
        render();
      };
    }
  }

  const txForm = document.getElementById('txForm');
  if(txForm) txForm.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(txForm);
    const type = f.get('type');
    let method = '';
    if(type==='Repayment'){
      const methodSel = document.getElementById('methodSelect').value;
      method = methodSel==='__other__' ? (document.getElementById('methodOther').value || 'Other') : methodSel;
    }
    transactions.push({
      id: uid(),
      date: f.get('date'),
      supplier: f.get('supplier'),
      type: type,
      method: method,
      amount: f.get('amount'),
      note: f.get('note')
    });
    await saveTransactions();
    showToast('Ledger entry saved');
    render();
  };

  const txType = document.getElementById('txType');
  const methodWrap = document.getElementById('methodWrap');
  const methodSelect = document.getElementById('methodSelect');
  const methodOtherWrap = document.getElementById('methodOtherWrap');
  if(txType) txType.onchange = ()=>{
    methodWrap.style.display = txType.value==='Repayment' ? 'block' : 'none';
    if(txType.value!=='Repayment') methodOtherWrap.style.display = 'none';
  };
  if(methodSelect) methodSelect.onchange = ()=>{
    methodOtherWrap.style.display = methodSelect.value==='__other__' ? 'block' : 'none';
  };

  document.querySelectorAll('[data-del-order]').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      orders = orders.filter(o=>o.id!==btn.dataset.delOrder);
      editingOrderId = null;
      selectedOrderId = null;
      await saveOrders();
      showToast('Order deleted');
      render();
    };
  });
  document.querySelectorAll('[data-del-tx]').forEach(btn=>{
    btn.onclick = async ()=>{
      transactions = transactions.filter(t=>t.id!==btn.dataset.delTx);
      await saveTransactions();
      showToast('Ledger entry deleted');
      render();
    };
  });

  const supplierForm = document.getElementById('supplierForm');
  if(supplierForm) supplierForm.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(supplierForm);
    suppliers.push({ id: uid(), name: f.get('name'), opening: f.get('opening') });
    await saveSuppliers();
    showToast('Supplier added');
    render();
  };
  document.querySelectorAll('[data-del-supplier]').forEach(btn=>{
    btn.onclick = async ()=>{
      suppliers = suppliers.filter(s=>s.id!==btn.dataset.delSupplier);
      await saveSuppliers();
      showToast('Supplier deleted');
      render();
    };
  });
}

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
loadData();
</script>
</body>
</html>
